```html
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial, Helvetica, sans-serif;
        }

        .forgot-box{
            width:420px;
            background:#fff;
            border-radius:15px;
            padding:35px;
            box-shadow:0 10px 30px rgba(255,140,0,.35);
        }

        .icon{
            width:80px;
            height:80px;
            background:#ff7a00;
            color:#fff;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:35px;
            margin:auto;
            margin-bottom:20px;
        }

        h2{
            text-align:center;
            color:#111;
            font-weight:bold;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        .form-label{
            font-weight:600;
            color:#111;
        }

        .form-control{
            height:48px;
            border-radius:8px;
        }

        .form-control:focus{
            border-color:#ff7a00;
            box-shadow:0 0 0 .2rem rgba(255,122,0,.25);
        }

        .btn-send{
            width:100%;
            height:48px;
            background:#ff7a00;
            color:#fff;
            border:none;
            border-radius:8px;
            font-weight:600;
            transition:.3s;
        }

        .btn-send:hover{
            background:#e56d00;
        }

        .btn-back{
            width:100%;
            height:48px;
            background:#111;
            color:#fff;
            border:none;
            border-radius:8px;
            font-weight:600;
            margin-top:12px;
            transition:.3s;
        }

        .btn-back:hover{
            background:#333;
        }

        .alert{
            border-radius:8px;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            text-decoration:none;
            color:#ff7a00;
            font-weight:600;
        }

        .login-link a:hover{
            color:#111;
        }
    </style>
</head>
<body>

<div class="forgot-box">

    <div class="icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2>Forgot Password</h2>

    <p>Enter your registered email address to receive a verification OTP.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <button type="submit" class="btn-send">
            <i class="bi bi-envelope-fill"></i> Send OTP
        </button>

        <button type="button" class="btn-back" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> Back
        </button>

    </form>

    <div class="login-link">
        <a href="{% url 'home' %}">
            <i class="bi bi-box-arrow-in-right"></i> Back to Login
        </a>
    </div>

</div>

</body>
</html>
```
