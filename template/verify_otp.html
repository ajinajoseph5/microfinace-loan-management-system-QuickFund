
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial, Helvetica, sans-serif;
        }

        .verify-box{
            width:440px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(255,122,0,.35);
        }

        .icon{
            width:80px;
            height:80px;
            margin:0 auto 20px;
            background:#ff7a00;
            color:#fff;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:34px;
        }

        h2{
            text-align:center;
            color:#111;
            font-weight:bold;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        .form-label{
            color:#111;
            font-weight:600;
        }

        .form-control{
            height:48px;
            border-radius:8px;
        }

        .form-control:focus{
            border-color:#ff7a00;
            box-shadow:0 0 0 .2rem rgba(255,122,0,.25);
        }

        .btn-reset{
            width:100%;
            height:48px;
            background:#ff7a00;
            color:#fff;
            border:none;
            border-radius:8px;
            font-weight:600;
            transition:.3s;
        }

        .btn-reset:hover{
            background:#e56d00;
        }

        .btn-back{
            width:100%;
            height:48px;
            margin-top:12px;
            background:#111;
            color:#fff;
            border:none;
            border-radius:8px;
            font-weight:600;
            transition:.3s;
        }

        .btn-back:hover{
            background:#333;
        }

        .back-link{
            text-align:center;
            margin-top:20px;
        }

        .back-link a{
            text-decoration:none;
            color:#ff7a00;
            font-weight:600;
        }

        .back-link a:hover{
            color:#111;
        }

        .alert{
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="verify-box">

    <div class="icon">
        <i class="bi bi-patch-check-fill"></i>
    </div>

    <h2>Verify OTP</h2>

    <p>Enter the OTP sent to your email and create a new password.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">OTP</label>
            <input type="text"
                   name="otp"
                   class="form-control"
                   placeholder="Enter 6-digit OTP"
                   maxlength="6"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password"
                   name="new_password"
                   class="form-control"
                   placeholder="Enter New Password"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm Password"
                   required>
        </div>

        <button type="submit" class="btn-reset">
            <i class="bi bi-key-fill"></i> Reset Password
        </button>

        <button type="button" class="btn-back" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> Back
        </button>
    </form>

    <div class="back-link">
        <a href="{% url 'forgot_password' %}">
            <i class="bi bi-envelope-fill"></i> Back to Forgot Password
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
