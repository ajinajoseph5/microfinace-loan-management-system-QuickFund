{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    background:#0d0d0d;
    font-family:'Poppins',sans-serif;
    color:#fff;
}

/* CONTAINER */

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CARD */

.password-card{
    width:420px;
    background:#111;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* HEADER */

.card-header{
    text-align:center;
    margin-bottom:25px;
}

.card-header i{
    font-size:45px;
    color:#ff6600;
    margin-bottom:10px;
}

.card-header h2{
    margin:0;
    font-size:28px;
}

.card-header p{
    color:#aaa;
    font-size:14px;
}

/* FORM */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:500;
}

.form-group input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:6px;
    background:#1c1c1c;
    color:#fff;
    font-size:14px;
    box-sizing:border-box;
}

.form-group input:focus{
    border:1px solid #ff6600;
}

/* BUTTON */

.btn{
    width:100%;
    padding:13px;
    background:#ff6600;
    border:none;
    border-radius:6px;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#e65c00;
}

/* MESSAGE */

.message{
    padding:12px;
    margin-bottom:18px;
    border-radius:6px;
    font-size:14px;
}

.success{
    background:#14532d;
}

.error{
    background:#7f1d1d;
}

/* BACK BUTTON */

.back-btn{
    text-align:center;
    margin-top:20px;
}

.back-btn a{
    color:#ff6600;
    text-decoration:none;
    font-size:14px;
}

.back-btn a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

    <div class="password-card">

        <!-- HEADER -->

        <div class="card-header">

            <i class="fa fa-lock"></i>

            <h2>Change Password</h2>

            <p>Update your account password</p>

        </div>

        <!-- MESSAGES -->

        {% if messages %}

            {% for message in messages %}

                <div class="message {% if message.tags == 'success' %}success{% else %}error{% endif %}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Old Password</label>

                <input type="password"
                       name="old_password"
                       required>

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input type="password"
                       name="new_password"
                       required>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input type="password"
                       name="confirm_password"
                       required>

            </div>

            <button type="submit" class="btn">

                Change Password

            </button>

        </form>

        <!-- BACK -->

        <div class="back-btn">

            <a href="../user_profile/">

                <i class="fa fa-arrow-left"></i>
                Back to Profile

            </a>

        </div>

    </div>

</div>

</body>
</html>
