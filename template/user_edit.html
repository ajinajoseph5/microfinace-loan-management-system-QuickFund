{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile</title>

<link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0d0d0d;
    color:#fff;
    min-height:100vh;
    padding:40px 15px;
}

/* WRAPPER */

.wrapper{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* TOP SECTION */

.top-bar{
    display:flex;
    align-items:center;
    margin-bottom:25px;
}

/* BACK BUTTON */

.back-btn a{
    width:58px;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151515;
    border:1px solid #242424;
    border-radius:16px;
    color:#fff;
    text-decoration:none;
    font-size:24px;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.back-btn a:hover{
    background:#ff6600;
    border-color:#ff6600;
    transform:translateX(-4px);
}

/* CARD */

.form-card{
    background:#111;
    padding:35px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* TITLE */

h2{
    text-align:center;
    margin-bottom:30px;
    font-size:34px;
    font-weight:600;
}

/* SUCCESS MESSAGE */

.message{
    text-align:center;
    color:#00ff99;
    margin-bottom:20px;
    font-size:15px;
}

/* FORM GROUP */

.form-group{
    margin-bottom:22px;
}

/* LABEL */

label{
    display:block;
    margin-bottom:8px;
    color:#cccccc;
    font-size:15px;
}

/* INPUTS */

input,
select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
    font-size:15px;
    transition:0.3s;
}

input:focus,
select:focus{
    outline:none;
    border:1px solid #ff6600;
    box-shadow:0 0 6px rgba(255,102,0,0.5);
}

/* SUBMIT BUTTON */

.btn{
    width:100%;
    padding:15px;
    background:#ff6600;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.btn:hover{
    background:#e65c00;
}

/* RESPONSIVE */

@media(max-width:768px){

    body{
        padding:25px 12px;
    }

    .form-card{
        padding:25px;
        border-radius:18px;
    }

    h2{
        font-size:28px;
    }

    .back-btn a{
        width:52px;
        height:52px;
        font-size:20px;
    }

}

</style>

</head>

<body>


<div class="wrapper">

    <!-- TOP BAR -->

    <div class="top-bar">

        <!-- BACK BUTTON -->

        <div class="back-btn">

            <a href="javascript:history.back()">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

        </div>

    </div>

    <!-- FORM CARD -->

    <div class="form-card">

        <h2>Edit Profile</h2>

        <!-- SUCCESS MESSAGE -->

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <!-- NAME -->

            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       name="name"
                       value="{{ data.name }}">

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ data.email }}">

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label>Phone</label>

                <input type="text"
                       name="phone"
                       value="{{ data.phone }}">

            </div>

            <!-- GENDER -->

            <div class="form-group">

                <label>Gender</label>

                <select name="gender">

                    <option value="Male"
                    {% if data.gender == "Male" %}
                    selected
                    {% endif %}>
                    Male
                    </option>

                    <option value="Female"
                    {% if data.gender == "Female" %}
                    selected
                    {% endif %}>
                    Female
                    </option>

                    <option value="Other"
                    {% if data.gender == "Other" %}
                    selected
                    {% endif %}>
                    Other
                    </option>

                </select>

            </div>

            <!-- DOB -->

            <div class="form-group">

                <label>Date of Birth</label>

                <input type="date"
                       name="dob"
                       value="{{ data.dob|date:'Y-m-d' }}">

            </div>

            <!-- BRANCH -->

            <div class="form-group">

                <label>Branch</label>

                <select name="branch_type">

                    <option value="Trivandrum"
                    {% if data.branch_type == "Trivandrum" %}
                    selected
                    {% endif %}>
                    Trivandrum
                    </option>

                    <option value="Kollam"
                    {% if data.branch_type == "Kollam" %}
                    selected
                    {% endif %}>
                    Kollam
                    </option>

                    <option value="Kottayam"
                    {% if data.branch_type == "Kottayam" %}
                    selected
                    {% endif %}>
                    Kottayam
                    </option>

                    <option value="Ernakulam"
                    {% if data.branch_type == "Ernakulam" %}
                    selected
                    {% endif %}>
                    Ernakulam
                    </option>

                </select>

            </div>

            <!-- ROLE -->

            <div class="form-group">

                <label>Role</label>

                <input type="text"
                       value="{{ data.role }}"
                       readonly>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn">

                Update Profile

            </button>

        </form>

    </div>

</div>

</body>

</html>
