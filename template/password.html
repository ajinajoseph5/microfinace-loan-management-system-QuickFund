<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0d0d0d;
            font-family:'Poppins',sans-serif;
            color:white;
            min-height:100vh;
            padding:40px 15px;
        }

        /* WRAPPER */

        .wrapper{
            width:100%;
            max-width:450px;
            margin:auto;
        }

        /* TOP BAR */

        .top-bar{
            display:flex;
            align-items:center;
            gap:15px;
            margin-bottom:20px;
        }

        /* BACK BUTTON */

        .back-btn a{
            width:55px;
            height:55px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#151515;
            border:1px solid #242424;
            border-radius:15px;
            color:white;
            text-decoration:none;
            font-size:22px;
            transition:0.3s;
            box-shadow:0 5px 15px rgba(0,0,0,0.4);
        }

        .back-btn a:hover{
            background:#ff6600;
            border-color:#ff6600;
            transform:translateX(-4px);
        }

        /* HEADING */

        .heading{
            font-size:30px;
            font-weight:600;
        }

        /* BOX */

        .box{
            background:#111;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
        }

        /* TITLE */

        .box h3{
            text-align:center;
            margin-bottom:25px;
            font-size:30px;
        }

        /* MESSAGE */

        .alert{
            background:#1a1a1a;
            color:#00ff99;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;
        }

        /* LABEL */

        label{
            display:block;
            margin-bottom:8px;
            color:#cccccc;
            font-size:15px;
        }

        /* INPUT */

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#1a1a1a;
            color:white;
            font-size:15px;
            margin-bottom:20px;
            transition:0.3s;
        }

        input:focus{
            outline:none;
            border:1px solid #ff6600;
            box-shadow:0 0 5px rgba(255,102,0,0.4);
        }

        /* BUTTONS */

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            text-decoration:none;
            display:block;
            text-align:center;
        }

        .btn-primary{
            background:#ff6600;
            color:white;
            margin-bottom:12px;
        }

        .btn-primary:hover{
            background:#e65c00;
        }

        .btn-secondary{
            background:#1f1f1f;
            color:white;
            border:1px solid #333;
        }

        .btn-secondary:hover{
            background:#2c2c2c;
        }

        /* RESPONSIVE */

        @media(max-width:600px){

            .box{
                padding:25px;
            }

            .heading{
                font-size:24px;
            }

            .box h3{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

<div class="wrapper">

    <!-- TOP BAR -->

    <div class="top-bar">

        <!-- BACK BUTTON -->

        <div class="back-btn">

            <a href="javascript:history.back()">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

        </div>

        <!-- HEADING -->

        <div class="heading">

            Password

        </div>

    </div>

    <!-- BOX -->

    <div class="box">

        <h3>Change Password</h3>

        <!-- MESSAGES -->

        {% if messages %}
            {% for message in messages %}

                <div class="alert">

                    {{ message }}

                </div>

            {% endfor %}
        {% endif %}

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <!-- NEW PASSWORD -->

            <div>

                <label>New Password</label>

                <input type="password"
                       name="new_password"
                       required>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div>

                <label>Confirm Password</label>

                <input type="password"
                       name="confirm_password"
                       required>

            </div>

            <!-- UPDATE BUTTON -->

            <button type="submit"
                    class="btn btn-primary">

                Update Password

            </button>

            <!-- CANCEL BUTTON -->

            <a href="{% url 'admin_staff' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
