{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Bank Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet" href="{% static 'bank_acc.css' %}">

</head>

<body>

<div class="bank-container">

    <h2 class="bank-title">
        Add Bank Account
    </h2>

    <form method="POST">

        {% csrf_token %}

        <div class="row">

            <div class="col-md-6">

                <div class="mb-3">
                    <label>Account Holder Name</label>

                    <input type="text"
                           name="account_holder"
                           class="form-control"
                           placeholder="Enter account holder name"
                           required>
                </div>

            </div>

            <div class="col-md-6">

                <div class="mb-3">
                    <label>Bank Name</label>

                    <input type="text"
                           name="bank_name"
                           class="form-control"
                           placeholder="Enter bank name"
                           required>
                </div>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6">

                <div class="mb-3">
                    <label>Account Number</label>

                    <input type="text"
                           name="account_number"
                           class="form-control"
                           placeholder="Enter account number"
                           required>
                </div>

            </div>

            <div class="col-md-6">

                <div class="mb-3">
                    <label>IFSC Code</label>

                    <input type="text"
                           name="ifsc_code"
                           class="form-control"
                           placeholder="Enter IFSC code"
                           required>
                </div>

            </div>

        </div>

        <div class="mb-4">

            <label>Branch Name</label>

            <input type="text"
                   name="branch_name"
                   class="form-control"
                   placeholder="Enter branch name"
                   required>

        </div>

        <button type="submit" class="btn-save">
            Save Bank Details
        </button>

    </form>

</div>

</body>
</html>
