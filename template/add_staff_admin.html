{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        QuickFund Registration
    </title>

    <!-- Bootstrap -->

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{% static 'reg.css' %}">

</head>

<body>

<!-- BACK BUTTON -->

<div class="container">

    <a href="{% url 'admin_home' %}"
       class="btn btn-orange"
       style="width:auto;
              padding:10px 20px;
              margin-bottom:20px;">

        <i class="fa fa-arrow-left"></i>

        Back

    </a>

</div>

<!-- REGISTRATION FORM -->

<div class="registration-container">

    <h2>

        QuickFund Registration

    </h2>

    <form action="{% url 'reg' %}"
          method="POST">

        {% csrf_token %}

        <div class="row">

            <!-- LEFT SIDE -->

            <div class="col-md-6 right-border">

                <div class="form-section-title">

                    Personal Details

                </div>

                <div class="form-group">

                    <label>

                        Full Name

                    </label>

                    <input type="text"
                           class="form-control"
                           name="name"
                           placeholder="Enter full name"
                           required>

                </div>

                <div class="form-group">

                    <label>

                        Email Address

                    </label>

                    <input type="email"
                           class="form-control"
                           name="email"
                           placeholder="Enter email"
                           required>

                </div>

                <div class="form-group">

                    <label>

                        Phone Number

                    </label>

                    <input type="number"
                           class="form-control"
                           name="phone"
                           placeholder="+91"
                           required>

                </div>

                <div class="form-group">

                    <label>

                        Gender

                    </label>

                    <br>

                    <label class="radio-inline">

                        <input type="radio"
                               name="gender"
                               value="Male"
                               checked>

                        Male

                    </label>

                    <label class="radio-inline">

                        <input type="radio"
                               name="gender"
                               value="Female">

                        Female

                    </label>

                    <label class="radio-inline">

                        <input type="radio"
                               name="gender"
                               value="Other">

                        Other

                    </label>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="col-md-6">

                <div class="form-section-title">

                    Account Settings

                </div>

                <div class="form-group">

                    <label>

                        Date of Birth

                    </label>

                    <input type="date"
                           class="form-control"
                           name="dob"
                           required>

                </div>

                <!-- USER TYPE -->

                <div class="form-group">

                    <label>

                        User Type

                    </label>

                    <select class="form-control"
                            name="user_type">

                        <option value="staff">

                            Staff

                        </option>

                    </select>

                </div>

                <!-- BRANCH -->

                <div class="form-group">

                    <label>

                        Branch

                    </label>

                    <select class="form-control"
                            name="branch_type">

                        <option value="Trivandrum">
                            Trivandrum
                        </option>

                        <option value="Kollam">
                            Kollam
                        </option>

                        <option value="Kottayam">
                            Kottayam
                        </option>

                        <option value="Ernakulam">
                            Ernakulam
                        </option>

                    </select>

                </div>

                <!-- PASSWORD -->

                <div class="form-group">

                    <label>

                        Password

                    </label>

                    <input type="password"
                           class="form-control"
                           name="pwd"
                           placeholder="Enter password"
                           required>

                </div>

            </div>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-orange">

            <i class="fa fa-user-plus"></i>

            Register Now

        </button>

    </form>

</div>

</body>

</html>
